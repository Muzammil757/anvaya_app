name: anvaya
description: "ANVAYA — AI-powered offline-first vernacular learning app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Standard starter icon set — kept only if your project already relies on it
  cupertino_icons: ^1.0.8

  # Required by worksheet_screen.dart for on-device PDF generation
  pdf: ^3.11.1

  # Required by worksheet_screen.dart for PDF preview, printing, and sharing
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/worksheet_content.json

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf

    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/NotoSansOlChiki-Regular.ttf
